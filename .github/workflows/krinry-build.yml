name: Free Internet Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options: [debug, profile, release]
      output_type:
        description: 'Output type'
        required: true
        default: 'apk'
        type: choice
        options: [apk, appbundle, apk-split]
      target_platform:
        description: 'Target platform'
        required: false
        default: 'all'
        type: choice
        options: [all, android-arm64, android-arm, android-x64]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'

      - name: Generate app icon
        run: |
          mkdir -p assets
          if [ ! -f assets/icon.png ]; then
            python3 -m pip install --quiet Pillow
            python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import math

          size = 1024
          img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)

          # Gradient background (pink -> purple)
          for y in range(size):
              for x in range(size):
                  t = (x + y) / (2 * size)
                  if t < 0.5:
                      t2 = t * 2
                      r = int(0xFF + (0x9C - 0xFF) * t2)
                      g = int(0x14 + (0x27 - 0x14) * t2)
                      b = int(0x93 + (0xB0 - 0x93) * t2)
                  else:
                      t2 = (t - 0.5) * 2
                      r = int(0x9C + (0x7B - 0x9C) * t2)
                      g = int(0x27 + (0x2F - 0x27) * t2)
                      b = int(0xB0 + (0xF7 - 0xB0) * t2)
                  img.putpixel((x, y), (r, g, b, 255))

          # Rounded corners mask
          mask = Image.new('L', (size, size), 0)
          md = ImageDraw.Draw(mask)
          md.rounded_rectangle([0, 0, size - 1, size - 1], radius=220, fill=255)
          bg = Image.new('RGBA', (size, size), (0, 0, 0, 0))
          bg.paste(img, (0, 0), mask)
          img = bg
          draw = ImageDraw.Draw(img)

          # Glow circle
          circle = Image.new('RGBA', (size, size), (0, 0, 0, 0))
          cd = ImageDraw.Draw(circle)
          cd.ellipse([332, 200, 692, 560], fill=(255, 255, 255, 40))
          cd.ellipse([382, 250, 642, 510], fill=(255, 255, 255, 35))
          img = Image.alpha_composite(img, circle)
          draw = ImageDraw.Draw(img)

          # Music note (simplified: two circles + two stems + beam)
          # Left note head
          draw.ellipse([280, 580, 400, 700], fill=(255, 255, 255, 255))
          # Right note head
          draw.ellipse([580, 540, 700, 660], fill=(255, 255, 255, 255))
          # Left stem
          draw.rectangle([380, 340, 400, 640], fill=(255, 255, 255, 255))
          # Right stem
          draw.rectangle([680, 300, 700, 600], fill=(255, 255, 255, 255))
          # Beam
          draw.polygon([(380, 340), (700, 300), (700, 380), (380, 420)], fill=(255, 255, 255, 255))

          # Crown (gold)
          crown_pts = [
              (420, 240), (450, 180), (480, 230), (512, 170),
              (544, 230), (574, 180), (604, 240), (604, 290),
              (420, 290)
          ]
          draw.polygon(crown_pts, fill=(255, 193, 7, 255), outline=(255, 143, 0, 255))
          # Crown base line
          draw.rectangle([420, 285, 604, 300], fill=(255, 152, 0, 255))

          # TWIST text
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 160)
          except:
              font = ImageFont.load_default()

          text = "TWIST"
          bbox = draw.textbbox((0, 0), text, font=font)
          tw = bbox[2] - bbox[0]
          th = bbox[3] - bbox[1]
          draw.text(((size - tw) / 2, 800 - th / 2), text, fill=(255, 255, 255, 255), font=font)

          img.save('assets/icon.png', 'PNG')
          print('Icon created:', img.size)
          PY
          fi
          ls -lh assets/icon.png

      - name: Pub get
        run: flutter pub get

      - name: Create android folder
        run: flutter create --platforms android .

      - name: Set app name
        run: |
          sed -i 's|android:label=".*"|android:label="Free Internet"|' android/app/src/main/AndroidManifest.xml

      - name: Add INTERNET permission
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build
        run: |
          TYPE="${{ github.event.inputs.build_type }}"
          OUT="${{ github.event.inputs.output_type }}"
          PLAT="${{ github.event.inputs.target_platform }}"
          if [ "$OUT" = "apk" ]; then
            if [ "$PLAT" != "all" ]; then
              flutter build apk --$TYPE --target-platform $PLAT
            else
              flutter build apk --$TYPE
            fi
          elif [ "$OUT" = "apk-split" ]; then
            flutter build apk --$TYPE --split-per-abi
          elif [ "$OUT" = "appbundle" ]; then
            flutter build appbundle --$TYPE
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*/*.aab
          retention-days: 7
